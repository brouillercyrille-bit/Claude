<title>MRR Partenaires</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark brand header with tabs, then a single 1200px column; dashboard = filters row, KPI strip, two charts, detail tables. */
:root {
  --bg: #f4f7f8;
  --surface: #ffffff;
  --surface-2: #eef3f4;
  --fg: #2a2536;
  --fg-2: #5b5668;
  --muted: #8a8696;
  --line: #e1e6e9;
  --teal: #00a5b5;
  --teal-ink: #00798a;
  --teal-soft: #d6f1f3;
  --orange: #ff9015;
  --orange-ink: #b45f00;
  --plum: #7e0a5c;
  --brand-dark: #39334a;
  --on-dark: #ffffff;
  --good: #1d8a5a;
  --warn: #b86a00;
  --bad: #b3261e;
  --good-bg: #e2f4ea;
  --warn-bg: #fdf0dc;
  --bad-bg: #fbe6e4;
  --shadow: 0 1px 2px rgba(42, 37, 54, .06), 0 6px 20px rgba(42, 37, 54, .06);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18151f; --surface: #221e2c; --surface-2: #2b2637; --fg: #eeecf3; --fg-2: #b9b5c4; --muted: #8d889b;
    --line: #363042; --teal: #1cb9c8; --teal-ink: #5fd3de; --teal-soft: #173c43; --orange: #ffa040; --orange-ink: #ffb466;
    --plum: #d05aa9; --brand-dark: #2b2538; --on-dark: #ffffff; --good: #4fc88d; --warn: #f0a845; --bad: #f07a70;
    --good-bg: #183528; --warn-bg: #3a2a12; --bad-bg: #3d1d1b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18151f; --surface: #221e2c; --surface-2: #2b2637; --fg: #eeecf3; --fg-2: #b9b5c4; --muted: #8d889b;
  --line: #363042; --teal: #1cb9c8; --teal-ink: #5fd3de; --teal-soft: #173c43; --orange: #ffa040; --orange-ink: #ffb466;
  --plum: #d05aa9; --brand-dark: #2b2538; --on-dark: #ffffff; --good: #4fc88d; --warn: #f0a845; --bad: #f07a70;
  --good-bg: #183528; --warn-bg: #3a2a12; --bad-bg: #3d1d1b; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; margin: 0; }
table, input, select, button { font: inherit; color: inherit; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }

/* Header */
.top { background: var(--brand-dark); color: var(--on-dark); }
.top-in { max-width: 1200px; margin: 0 auto; padding: 18px 16px 0; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
.mark { width: 34px; height: 34px; border-radius: 8px; background: var(--teal); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); border: 3px solid var(--brand-dark); }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 12px; opacity: .72; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { background: transparent; border: 0; color: var(--on-dark); opacity: .72; padding: 10px 14px 12px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab:hover { opacity: 1; }
.tab[aria-selected="true"] { opacity: 1; border-bottom-color: var(--orange); }
.tab:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }

main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 20px; }
main > section, main > div { min-width: 0; }
.banner { padding: 10px 14px; border-radius: var(--r); background: var(--warn-bg); color: var(--fg); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.banner.info { background: var(--teal-soft); }

.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; text-wrap: balance; }
.card .sub { margin: 0 0 14px; color: var(--fg-2); font-size: 13px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Controls */
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--fg-2); }
input[type="text"], input[type="number"], input[type="month"], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; min-height: 36px; min-width: 0; max-width: 100%;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 6px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 5px; cursor: pointer; font-weight: 600; min-height: 36px; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--teal-ink); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.del-btn { padding: 4px 8px; min-height: 30px; font-size: 12px; white-space: nowrap; }
.del-btn.icon { padding: 2px 7px; min-height: 26px; font-size: 13px; opacity: .55; }
tr:hover .del-btn.icon, .del-btn.icon:focus-visible, .del-btn.armed { opacity: 1; }
.name-cell { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.name-cell > div { min-width: 0; }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 18px; display: grid; gap: 2px; align-content: start; }
.kpi .v { font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .d { font-size: 12px; color: var(--fg-2); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--teal); border-radius: 3px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }

.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Rep bars */
.reps { display: grid; gap: 4px; }
.rep-row { display: grid; grid-template-columns: minmax(90px, 180px) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 4px; border-radius: 4px; }
.rep-row:hover { background: var(--surface-2); }
.rep-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-name small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.track { position: relative; height: 18px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.track .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); border-radius: 0 4px 4px 0; min-width: 2px; }
.track .tgt { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--orange); }
.rep-val { text-align: right; display: grid; justify-items: end; gap: 2px; min-width: 92px; }
.rep-val b { font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--fg-2); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { width: 14px; height: 0; border-top: 2px dashed var(--orange); border-radius: 0; vertical-align: 3px; }
.legend i.tick { width: 2px; height: 12px; background: var(--orange); border-radius: 0; }

/* SVG chart */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-wrap text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--brand-dark); color: var(--on-dark); padding: 8px 10px; border-radius: 5px; font-size: 12px; line-height: 1.45; box-shadow: var(--shadow); max-width: 240px; }
.tip b { font-weight: 700; }

/* Tables */
.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
table.t tr.hl td { background: var(--teal-soft); }
table.t td.zero { color: var(--muted); }
table.t th.cur, table.t td.cur { background: var(--teal-soft); }
.mrr-in { width: 92px; min-height: 32px !important; padding: 5px 6px !important; text-align: right; font-variant-numeric: tabular-nums; }
.mrr-in::-webkit-inner-spin-button, .mrr-in::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.mrr-in { -moz-appearance: textfield; }
.mrr-in.pre { border-color: var(--warn); background: var(--warn-bg); }
.rec-in { width: 140px; min-height: 32px !important; padding: 4px 6px !important; }
.oip-in { width: 110px; min-height: 32px !important; padding: 4px 6px !important; }
.oip-in:placeholder-shown { border-style: dashed; }
.prod-btn { display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; width: 170px; min-height: 32px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; }
.prod-btn.wide { width: 100%; min-height: 36px; }
.prod-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.prod-btn .ph { color: var(--muted); }
.prod-btn.empty-v { border-style: dashed; }
.prod-btn:hover { border-color: var(--teal); }
.prod-btn:disabled { opacity: .6; cursor: default; }
.pick-back { position: fixed; inset: 0; z-index: 45; }
.pick { position: fixed; z-index: 46; width: 250px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 8px; }
.pick-q { width: 100%; }
.pick-list { max-height: 240px; overflow-y: auto; display: grid; }
.pick-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 4px; cursor: pointer; }
.pick-item:hover { background: var(--surface-2); }
.pick-item[hidden] { display: none; }
.pick-item input { width: 16px; height: 16px; accent-color: var(--teal); flex: none; }
.pick-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }
textarea#prodCat { width: 100%; min-height: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; font: inherit; color: inherit; resize: vertical; }
table.grid td, table.grid th { padding: 5px 4px; }
table.grid td.sticky, table.grid th.sticky { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 210px; max-width: 260px; padding-left: 8px; box-shadow: 1px 0 0 var(--line); }
table.grid td.sticky small { display: block; color: var(--muted); font-size: 11px; }
table.grid td.off { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--surface-2) 5px 7px); }
table.grid tbody tr:hover td { background-color: var(--surface-2); }
table.grid tbody tr:hover td.sticky { background: var(--surface-2); }
.saved { color: var(--good); font-size: 12px; font-weight: 600; }

form.stack { display: grid; gap: 12px; }
.tgt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.tgt-grid input { width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.b-table th small { display: block; font-size: 10px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.b-cell { white-space: nowrap; }
.b-cell b { display: block; font-variant-numeric: tabular-nums; }
.b-cell .chip { margin-top: 2px; }
.strip { display: flex; gap: 3px; }
.strip i { width: 12px; height: 16px; border-radius: 2px; background: var(--surface-2); }
.strip i.on { background: var(--teal); }
.foot { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-2); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--fg); font-size: 15px; }
.row-actions { display: flex; gap: 2px; justify-content: flex-end; }
.muted { color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }

.overlay { position: fixed; inset: 0; background: rgba(20, 16, 28, .5); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { background: var(--surface); border-radius: 8px; padding: 20px; width: min(420px, 100%); box-shadow: var(--shadow); }
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.modal .acts { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--brand-dark); color: var(--on-dark); padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; z-index: 60; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .track .bar, .meter i { transition: width .35s ease; } }
@media (max-width: 520px) {
  .rep-row { grid-template-columns: minmax(70px, 100px) minmax(0, 1fr) auto; gap: 8px; }
  .kpi .v { font-size: 24px; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>MRR Partenaires</h1>
        <p>Objectif de MRR par commercial ce mois-ci : <span id="hdrTarget">500 €</span><span id="hdrUpdated"></span></p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-dash" data-tab="dash" aria-selected="true">Tableau de bord</button>
      <button class="tab" role="tab" id="tab-bonus" data-tab="bonus" aria-selected="false">Suivi des primes</button>
      <button class="tab" role="tab" id="tab-entry" data-tab="entry" aria-selected="false">Saisie MRR mensuel</button>
      <button class="tab" role="tab" id="tab-partners" data-tab="partners" aria-selected="false">Partenaires</button>
      <button class="tab" role="tab" id="tab-team" data-tab="team" aria-selected="false">Équipe &amp; objectifs</button>
      <button class="tab" role="tab" id="tab-visits" data-tab="visits" aria-selected="false" hidden>Connexions</button>
    </nav>
  </div>
</header>

<main id="app">
  <div id="banner"></div>
  <section id="view-dash"></section>
  <section id="view-bonus" hidden></section>
  <section id="view-entry" hidden></section>
  <section id="view-partners" hidden></section>
  <section id="view-team" hidden></section>
  <section id="view-visits" hidden></section>
  <p class="foot">Les consultations de cette page (personne, date) sont enregistrées pour le suivi de l'équipe. Seuls les administrateurs de la page les voient.</p>
</main>
<div class="tip" id="tip" hidden></div>
<div id="modalRoot"></div>
<div id="pickRoot"></div>

<script>
(() => {
  "use strict";
  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = v => eur.format(v || 0);
  // amounts are kept to the cent; accepts "1234,56" as well as "1234.56"
  const cents = v => Math.round(v * 100) / 100;
  const parseAmount = raw => { const n = +String(raw).replace(/\s/g, "").replace(",", "."); return isFinite(n) ? Math.max(0, cents(n)) : NaN; };
  const fmtK = v => v >= 10000 ? (Math.round(v / 100) / 10).toString().replace(".", ",") + " k€" : Math.round(v).toLocaleString("fr-FR") + " €";
  const pct = v => isFinite(v) ? Math.round(v * 100) + " %" : "—";
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const MONTHS_L = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const now = new Date();
  const CUR = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const ym = (y, m) => `${y}-${String(m).padStart(2, "0")}`;
  const yOf = k => +k.slice(0, 4);
  const mOf = k => +k.slice(5, 7);
  const mLabel = k => `${MONTHS[mOf(k) - 1]} ${String(yOf(k)).slice(2)}`;
  const mLong = k => `${MONTHS_L[mOf(k) - 1]} ${yOf(k)}`;
  const addM = (k, n) => { const d = new Date(yOf(k), mOf(k) - 1 + n, 1); return ym(d.getFullYear(), d.getMonth() + 1); };
  const range = (a, b) => { const out = []; for (let k = a; k <= b; k = addM(k, 1)) out.push(k); return out; };
  const qOf = k => Math.ceil(mOf(k) / 3);
  const status = r => !isFinite(r) ? null : r >= 1 ? ["good", "✓", "Objectif atteint"] : r >= 0.7 ? ["warn", "●", "Proche"] : ["bad", "▼", "En retard"];
  const chip = r => { const s = status(r); return s ? `<span class="chip ${s[0]}" title="${s[2]}"><span aria-hidden="true">${s[1]}</span>${pct(r)}</span>` : `<span class="muted">—</span>`; };
  const safeLS = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- state ----------
  const S = { reps: [], partners: [], settings: { monthlyTarget: 500 }, mode: "loading", canWrite: true, loaded: false, isAdmin: false, visits: null, names: {} };
  const prefs = safeLS.get("mrr-ui") || {};
  const ui = {
    bonusYear: now.getFullYear(),
    bonusGran: "month",
    tab: ["dash", "bonus", "entry", "partners", "team", "visits"].includes(location.hash.slice(1)) ? location.hash.slice(1) : (prefs.tab || "dash"),
    gran: prefs.gran || "quarter",
    period: null,
    dashRep: "all",
    entryYear: now.getFullYear(),
    entryQ: "",
    entryRep: prefs.entryRep || "all",
    partnerRep: "all",
    npProducts: [],
    teamYear: now.getFullYear(),
    partnerQ: ""
  };
  const savePrefs = () => safeLS.set("mrr-ui", { tab: ui.tab, gran: ui.gran, entryRep: ui.entryRep });

  // ---------- backend (shared db, or this browser as fallback) ----------
  let db = null, downloads = null, userApi = null;
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  // one visit per page load, written to the viewer's own document
  async function logVisit(uid) {
    try {
      const ref = db.doc("visits/" + uid);
      const snap = await ref.get();
      const d = snap.exists ? snap.data() : {};
      const days = { ...(d.days || {}) }, k = dayKey(new Date());
      days[k] = (days[k] || 0) + 1;
      const ks = Object.keys(days).sort();
      while (ks.length > 180) delete days[ks.shift()];
      await ref.set({ count: (+d.count || 0) + 1, firstAt: d.firstAt || Date.now(), lastAt: Date.now(), days });
    } catch {}
  }
  async function resolveNames() {
    if (!userApi || !S.visits) return;
    const missing = S.visits.map(v => v.id).filter(id => !(id in S.names));
    if (!missing.length) return;
    try {
      const ps = await userApi.profiles(missing);
      missing.forEach(id => { S.names[id] = (ps[id] && ps[id].name) || ""; });
      if (ui.tab === "visits") render();
    } catch {}
  }
  const LOCAL_KEY = "mrr-partenaires-data";
  const local = {
    load() { const d = safeLS.get(LOCAL_KEY); if (d) { S.reps = d.reps || []; S.partners = d.partners || []; S.settings = d.settings || S.settings; } },
    persist() { safeLS.set(LOCAL_KEY, { reps: S.reps, partners: S.partners, settings: S.settings }); }
  };
  const strip = o => { const { id, ...rest } = o; return JSON.parse(JSON.stringify(rest)); };
  function upsertLocal(list, item) { const i = list.findIndex(x => x.id === item.id); if (i >= 0) list[i] = item; else list.push(item); }

  const api = {
    async saveRep(r) {
      if (db) return db.collection("reps").doc(r.id).set(strip(r));
      upsertLocal(S.reps, r); local.persist(); render();
    },
    async deleteRep(id) {
      if (db) return db.collection("reps").doc(id).delete();
      S.reps = S.reps.filter(r => r.id !== id); local.persist(); render();
    },
    async savePartner(p) {
      if (db) return db.collection("partners").doc(p.id).set(strip(p));
      upsertLocal(S.partners, p); local.persist(); render();
    },
    async deletePartner(id) {
      if (db) return db.collection("partners").doc(id).delete();
      S.partners = S.partners.filter(p => p.id !== id); local.persist(); render();
    },
    async saveSettings(s) {
      s = { ...s, updatedAt: Date.now() };
      if (db) return db.doc("settings/main").set(s);
      S.settings = s; local.persist(); render();
    }
  };
  async function guarded(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === "invalid_argument" && db) { S.canWrite = false; render(); toast("Vous avez un accès en lecture seule : modification non enregistrée."); }
      else if (c === "quota_exceeded") toast("Espace de stockage plein : supprimez d'anciens partenaires puis réessayez.");
      else toast("Enregistrement impossible pour le moment. Réessayez dans quelques secondes.");
      return false;
    }
  }

  async function boot() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { startLocal(); return; }
    let user = null;
    try {
      [db, user, downloads] = await Promise.all([c.use("db"), c.use("user").catch(() => null), c.use("downloads").catch(() => null)]);
    } catch { db = null; }
    if (!db) { startLocal(); return; }
    S.mode = "db";
    if (user) { try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch {} }
    userApi = user;
    if (user) {
      try {
        const [admin, owner, uid] = await Promise.all([user.canEdit(), user.isOwner(), user.id()]);
        S.isAdmin = !!admin;
        if (uid && !owner) logVisit(uid);
      } catch {}
    }
    if (S.isAdmin) {
      db.collection("visits").onSnapshot(s => { S.visits = s.docs.map(d => ({ id: d.id, ...d.data() })); resolveNames(); if (ui.tab === "visits") render(); }, () => { S.visits = []; });
    }
    const ready = { reps: false, partners: false, settings: false };
    const done = k => { ready[k] = true; if (ready.reps && ready.partners && ready.settings) S.loaded = true; render(); };
    const onErr = () => { S.mode = "error"; render(); };
    db.collection("reps").onSnapshot(s => { S.reps = s.docs.map(d => ({ id: d.id, ...d.data() })); done("reps"); }, onErr);
    db.collection("partners").onSnapshot(s => { S.partners = s.docs.map(d => ({ id: d.id, ...d.data() })); done("partners"); }, onErr);
    db.doc("settings/main").onSnapshot(s => { S.settings = s.exists ? { monthlyTarget: 500, ...s.data() } : { monthlyTarget: 500 }; done("settings"); }, onErr);
  }
  function startLocal() { S.mode = "local"; S.isAdmin = true; S.visits = []; local.load(); S.loaded = true; render(); }

  // ---------- derived data ----------
  const repName = id => (S.reps.find(r => r.id === id) || {}).name || "Non attribué";
  const sortedReps = () => [...S.reps].sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, "fr"));
  const activeReps = () => sortedReps().filter(r => r.active !== false);
  const target = () => +S.settings.monthlyTarget || 0;
  // objective per salesperson for a given month: month override, else the default
  const targetFor = k => { const o = (S.settings.targets || {})[k]; return o === undefined || o === null ? target() : +o || 0; };
  const lastUpdate = () => Math.max(0, +S.settings.updatedAt || 0, ...S.partners.map(p => +p.updatedAt || +p.createdAt || 0));
  const sumTargets = ks => ks.reduce((t, k) => t + targetFor(k), 0);
  const mrrOf = (p, k) => +((p.mrr || {})[k]) || 0;
  const DEFAULT_PRODUCTS = ["Accès internet", "Call2Teams", "Cloud", "Couverture GSM", "Couverture Wifi", "Dstny UCaaS", "Dstny Digital Assistant", "Mobile", "Phonio", "Services & Installation", "Téléphonie IP", "Téléphonie Standard", "VoIPcube"];
  const catalog = () => (Array.isArray(S.settings.products) && S.settings.products.length ? S.settings.products : DEFAULT_PRODUCTS);
  // products a partner sells (older entries kept a single "product" text)
  // partners sharing the same name (case/spacing-insensitive): likely duplicates
  const normName = n => String(n || "").trim().toLowerCase().replace(/\s+/g, " ");
  const dupIds = () => { const c = {}; S.partners.forEach(p => { const k = normName(p.name); c[k] = (c[k] || 0) + 1; }); return new Set(S.partners.filter(p => c[normName(p.name)] > 1).map(p => p.id)); };
  const dupChip = (dups, p) => dups.has(p.id) ? ` <span class="chip warn" title="Un autre partenaire porte le même nom">Doublon ?</span>` : "";
  const delBtn = (p, icon) => `<button type="button" class="btn ghost danger del-btn${icon ? " icon" : ""}" data-delp="${p.id}" data-label="${icon ? "✕" : "Supprimer"}" aria-label="Supprimer ${esc(p.name)}" title="Supprimer cette ligne">${icon ? "✕" : "Supprimer"}</button>`;
  const prods = p => Array.isArray(p.products) ? p.products : (p.product ? [p.product] : []);
  const prodBtn = (id, arr, ro, wide) => `<button type="button" class="prod-btn${wide ? " wide" : ""}${arr.length ? "" : " empty-v"}" data-pick="${id}" title="${esc(arr.join(", "))}" aria-label="Type de produit DFP : ${esc(arr.join(", ") || "aucun")}" ${ro ? "disabled" : ""}><span>${arr.length ? esc(arr.length <= 2 ? arr.join(", ") : arr.slice(0, 2).join(", ") + " +" + (arr.length - 2)) : '<span class="ph">À saisir</span>'}</span><span aria-hidden="true">▾</span></button>`;

  function dataBounds() {
    let min = CUR;
    for (const p of S.partners) {
      if (p.recruited && p.recruited < min) min = p.recruited;
      for (const k of Object.keys(p.mrr || {})) if (k < min) min = k;
    }
    return { min, max: CUR };
  }
  function periodOptions(gran) {
    const { min } = dataBounds();
    const y0 = Math.min(yOf(min), now.getFullYear() - 1), y1 = now.getFullYear();
    const opts = [];
    if (gran === "month") for (let k = CUR; k >= ym(y0, 1); k = addM(k, -1)) opts.push([k, mLong(k)]);
    if (gran === "quarter") for (let y = y1; y >= y0; y--) for (let q = 4; q >= 1; q--) { if (y === y1 && q > qOf(CUR)) continue; opts.push([`${y}-Q${q}`, `T${q} ${y}`]); }
    if (gran === "year") for (let y = y1; y >= y0; y--) opts.push([String(y), String(y)]);
    if (gran === "all") opts.push(["all", "Depuis le début"]);
    return opts;
  }
  function defaultPeriod(gran) {
    return gran === "month" ? CUR : gran === "quarter" ? `${now.getFullYear()}-Q${qOf(CUR)}` : gran === "year" ? String(now.getFullYear()) : "all";
  }
  function monthsOf(gran, period) {
    if (gran === "month") return [period];
    if (gran === "quarter") { const [y, q] = period.split("-Q").map(Number); return range(ym(y, q * 3 - 2), ym(y, q * 3)); }
    if (gran === "year") return range(ym(+period, 1), ym(+period, 12));
    return range(dataBounds().min, CUR);
  }
  function periodLabel(gran, period) {
    return gran === "month" ? mLong(period) : gran === "quarter" ? period.replace(/(\d{4})-Q(\d)/, "T$2 $1") : gran === "year" ? period : "depuis le début";
  }
  // Reps shown in the dashboard: active ones, plus inactive ones that produced MRR in the window
  function scopeReps(months) {
    const set = new Set(months);
    const withMrr = new Set(S.partners.filter(p => months.some(k => mrrOf(p, k) > 0)).map(p => p.repId));
    let reps = sortedReps().filter(r => r.active !== false || withMrr.has(r.id));
    if (ui.dashRep !== "all") reps = reps.filter(r => r.id === ui.dashRep);
    return reps;
  }
  function repStats(rep, months) {
    const elapsed = months.filter(k => k <= CUR);
    const ps = S.partners.filter(p => p.repId === rep.id);
    const mrr = ps.reduce((s, p) => s + months.reduce((t, k) => t + mrrOf(p, k), 0), 0);
    const recruited = ps.filter(p => p.recruited && months.includes(p.recruited)).length;
    const tgt = rep.active === false ? 0 : sumTargets(elapsed);
    return { rep, mrr, recruited, tgt, ratio: tgt ? mrr / tgt : NaN, partners: ps.filter(p => months.some(k => mrrOf(p, k) > 0)).length };
  }

  // ---------- render ----------
  function render() {
    $("#hdrTarget").textContent = fmt(targetFor(CUR));
    const lu = lastUpdate();
    $("#hdrUpdated").textContent = lu ? " · données mises à jour le " + new Date(lu).toLocaleString("fr-FR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "";
    $("#tab-visits").hidden = !S.isAdmin;
    if (ui.tab === "visits" && !S.isAdmin && S.mode !== "loading") ui.tab = "dash";
    $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === ui.tab)));
    ["dash", "bonus", "entry", "partners", "team", "visits"].forEach(v => { $("#view-" + v).hidden = v !== ui.tab; });
    renderBanner();
    if (ui.tab === "dash") renderDash();
    if (ui.tab === "entry") renderEntry();
    if (ui.tab === "partners") renderPartners();
    if (ui.tab === "team") renderTeam();
    if (ui.tab === "bonus") renderBonus();
    if (ui.tab === "visits") renderVisits();
  }

  function renderBanner() {
    let h = "";
    if (S.mode === "loading") h = `<div class="banner info">Chargement des données…</div>`;
    else if (S.mode === "local") h = `<div class="banner"><span>Les données sont enregistrées dans <b>ce navigateur uniquement</b>. Ouvrez la page depuis son lien claude.ai pour les partager avec l'équipe.</span>${!S.partners.length && !S.reps.length ? `<button class="btn" data-act="demo">Charger un exemple</button>` : ""}</div>`;
    else if (S.mode === "error") h = `<div class="banner">La connexion aux données a été interrompue. Rechargez la page pour la rétablir.</div>`;
    else if (!S.canWrite) h = `<div class="banner info">Vous consultez ce tableau de bord en lecture seule.</div>`;
    $("#banner").innerHTML = h;
  }

  function emptyTeam() {
    return `<div class="card"><div class="empty"><strong>Commencez par ajouter vos commerciaux</strong>
      <span>Ajoutez les 9 commerciaux de l'équipe dans « Équipe &amp; objectifs », puis enregistrez les partenaires qu'ils recrutent et leur MRR mensuel.</span>
      ${S.canWrite ? `<button class="btn primary" data-goto="team">Ajouter les commerciaux</button>` : ""}</div></div>`;
  }

  // ----- Dashboard -----
  function renderDash() {
    const el = $("#view-dash");
    if (!S.loaded) { el.innerHTML = ""; return; }
    if (!S.reps.length) { el.innerHTML = emptyTeam(); return; }
    const opts = periodOptions(ui.gran);
    if (!ui.period || !opts.some(o => o[0] === ui.period)) ui.period = opts.some(o => o[0] === defaultPeriod(ui.gran)) ? defaultPeriod(ui.gran) : opts[0][0];
    const months = monthsOf(ui.gran, ui.period);
    const elapsed = months.filter(k => k <= CUR);
    const reps = scopeReps(months);
    const stats = reps.map(r => repStats(r, months));
    const repIds = new Set(reps.map(r => r.id));
    const total = stats.reduce((s, x) => s + x.mrr, 0);
    const tgt = stats.reduce((s, x) => s + x.tgt, 0);
    const fullTgt = reps.filter(r => r.active !== false).length * sumTargets(months);
    const recruited = stats.reduce((s, x) => s + x.recruited, 0);
    const activeP = S.partners.filter(p => repIds.has(p.repId) && months.some(k => mrrOf(p, k) > 0)).length;
    const ratio = tgt ? total / tgt : NaN;
    const perRepMonth = reps.length && elapsed.length ? total / (stats.filter(s => s.tgt).length || 1) / elapsed.length : 0;
    const remaining = Math.max(0, fullTgt - total);
    const pLabel = periodLabel(ui.gran, ui.period);

    el.innerHTML = `
      <div style="display:grid;gap:20px">
      <div class="filters">
        <div class="field"><span>Période</span>
          <div class="seg" role="group" aria-label="Granularité">
            ${[["month", "Mois"], ["quarter", "Trimestre"], ["year", "Année"], ["all", "Tout"]].map(([g, l]) => `<button data-gran="${g}" aria-pressed="${ui.gran === g}">${l}</button>`).join("")}
          </div>
        </div>
        ${ui.gran !== "all" ? `<label class="field"><span>${ui.gran === "month" ? "Mois" : ui.gran === "quarter" ? "Trimestre" : "Année"}</span>
          <select id="periodSel">${opts.map(([v, l]) => `<option value="${v}" ${v === ui.period ? "selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
        <label class="field"><span>Commercial</span>
          <select id="dashRep"><option value="all">Toute l'équipe</option>${sortedReps().map(r => `<option value="${r.id}" ${ui.dashRep === r.id ? "selected" : ""}>${esc(r.name)}${r.active === false ? " (inactif)" : ""}</option>`).join("")}</select></label>
        <div style="flex:1"></div>
        <button class="btn" data-act="export">Exporter en CSV</button>
      </div>

      <div class="kpis">
        <div class="kpi"><span class="label">MRR nouveaux partenaires</span><span class="v">${fmt(total)}</span>
          <span class="d">${esc(pLabel)}${ui.dashRep !== "all" ? " · " + esc(repName(ui.dashRep)) : ""}</span></div>
        <div class="kpi"><span class="label">Atteinte objectif à date</span><span class="v">${isFinite(ratio) ? pct(ratio) : "—"}</span>
          <span class="d">Objectif à date ${fmt(tgt)} ${chip(ratio)}</span>
          <div class="meter" aria-hidden="true"><i style="width:${Math.min(100, (ratio || 0) * 100)}%"></i></div></div>
        <div class="kpi"><span class="label">Reste à faire</span><span class="v">${fmt(remaining)}</span>
          <span class="d">sur un objectif de période de ${fmt(fullTgt)}</span></div>
        <div class="kpi"><span class="label">Partenaires</span><span class="v">${recruited} <span style="font-size:15px;font-weight:600;color:var(--fg-2)">recrutés</span></span>
          <span class="d">${activeP} partenaire${activeP > 1 ? "s" : ""} ont généré du MRR · ${fmt(perRepMonth)} / commercial / mois</span></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>Performance par commercial</h2>
          <p class="sub">MRR ${esc(pLabel)} face à l'objectif à date (${fmt(sumTargets(elapsed))} par commercial sur ${elapsed.length} mois écoulé${elapsed.length > 1 ? "s" : ""})</p>
          ${repBars(stats)}
          <div class="legend"><span><i style="background:var(--teal)"></i>MRR réalisé</span><span><i class="tick"></i>Objectif à date</span></div>
        </div>
        <div class="card">
          <h2>Évolution mensuelle</h2>
          <p class="sub">${ui.gran === "all" ? "Tous les mois" : "Année " + yOf(months[0])} · MRR de ${ui.dashRep === "all" ? "l'équipe" : esc(repName(ui.dashRep))}, période sélectionnée en couleur</p>
          <div class="chart-wrap" id="monthChart"></div>
          <div class="legend"><span><i style="background:var(--teal)"></i>MRR du mois</span><span><i class="line"></i>Objectif mensuel ${ui.dashRep === "all" ? "de l'équipe" : "du commercial"}</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Détail mois par mois</h2>
        <p class="sub">MRR généré par les nouveaux partenaires de chaque commercial${ui.gran === "all" ? "" : ", année " + yOf(months[0])}</p>
        <div class="tbl-wrap">${matrix(reps, months)}</div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>Classement</h2>
          <p class="sub">${esc(pLabel)}</p>
          <div class="tbl-wrap"><table class="t">
            <thead><tr><th>#</th><th>Commercial</th><th class="n">Recrutés</th><th class="n">MRR</th><th class="n">Objectif</th><th class="n">Atteinte</th></tr></thead>
            <tbody>${[...stats].sort((a, b) => b.mrr - a.mrr).map((s, i) => `<tr><td class="num muted">${i + 1}</td><td style="white-space:nowrap">${esc(s.rep.name)}</td><td class="n">${s.recruited}</td><td class="n"><b>${fmt(s.mrr)}</b></td><td class="n">${s.tgt ? fmt(s.tgt) : "—"}</td><td class="n">${chip(s.ratio)}</td></tr>`).join("")}</tbody>
          </table></div>
        </div>
        <div class="card">
          <h2>Top partenaires</h2>
          <p class="sub">Plus gros contributeurs au MRR, ${esc(pLabel)}</p>
          ${topPartners(months, repIds)}
        </div>
      </div>
      </div>`;
    monthChart(reps, months);
  }

  function repBars(stats) {
    if (!stats.length) return `<div class="empty">Aucun commercial dans ce périmètre.</div>`;
    const max = Math.max(1, ...stats.map(s => Math.max(s.mrr, s.tgt))) * 1.05;
    return `<div class="reps">${stats.map(s => `
      <div class="rep-row" data-tip="<b>${esc(s.rep.name)}</b><br>MRR : ${fmt(s.mrr)}<br>Objectif à date : ${s.tgt ? fmt(s.tgt) : "—"}<br>Partenaires recrutés : ${s.recruited}<br>Partenaires productifs : ${s.partners}">
        <div class="rep-name">${esc(s.rep.name)}<small>${s.recruited} recruté${s.recruited > 1 ? "s" : ""}</small></div>
        <div class="track"><div class="bar" style="width:${(s.mrr / max) * 100}%"></div>${s.tgt ? `<div class="tgt" style="left:${(s.tgt / max) * 100}%"></div>` : ""}</div>
        <div class="rep-val"><b>${fmt(s.mrr)}</b>${chip(s.ratio)}</div>
      </div>`).join("")}</div>`;
  }

  function contextMonths(months) {
    if (ui.gran === "all") return months.slice(-24);
    const y = yOf(months[0]);
    return range(ym(y, 1), ym(y, 12));
  }

  function monthChart(reps, months) {
    const box = $("#monthChart");
    if (!box) return;
    const ctx = contextMonths(months);
    const ids = new Set(reps.map(r => r.id));
    const vals = ctx.map(k => S.partners.filter(p => ids.has(p.repId)).reduce((s, p) => s + mrrOf(p, k), 0));
    const nAct = reps.filter(r => r.active !== false).length;
    const tl = ctx.map(k => targetFor(k) * nAct);
    const W = 620, H = 260, L = 52, R = 8, T = 14, B = 28;
    const top = niceMax(Math.max(...tl, ...vals, 1));
    const ticks = 4;
    const y = v => T + (H - T - B) * (1 - v / top);
    const bw = (W - L - R) / ctx.length;
    const inSel = new Set(months);
    let g = "";
    for (let i = 0; i <= ticks; i++) {
      const v = top * i / ticks, yy = y(v);
      g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1" ${i ? 'stroke-dasharray="2 3"' : ""}/>`;
      g += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end">${fmtK(v)}</text>`;
    }
    const labelEvery = ctx.length > 12 ? Math.ceil(ctx.length / 12) : 1;
    ctx.forEach((k, i) => {
      const x = L + i * bw, w = Math.max(2, bw - 6), h = Math.max(0, y(0) - y(vals[i]));
      const sel = inSel.has(k), fut = k > CUR;
      const r = Math.min(4, w / 2, h);
      const x0 = x + 3, y0 = y(vals[i]);
      if (h > 0) g += `<path d="M${x0},${y(0)} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + w - r} Q${x0 + w},${y0} ${x0 + w},${y0 + r} V${y(0)} Z" fill="var(--teal)" opacity="${sel ? 1 : 0.32}"/>`;
      if (i % labelEvery === 0) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${sel ? 'style="fill:var(--fg);font-weight:600"' : ""}>${ctx.length > 12 ? mLabel(k) : MONTHS[mOf(k) - 1]}</text>`;
      const tline = tl[i], ratio = tline ? vals[i] / tline : NaN;
      g += `<rect x="${x}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-tip="<b>${esc(mLong(k))}</b><br>MRR : ${fmt(vals[i])}<br>Objectif : ${fmt(tline)}${tline ? ` (${fut ? "à venir" : pct(ratio)})` : ""}"/>`;
    });
    // stepped objective line: one level per month
    if (nAct) g += `<path d="${tl.map((t, i) => `${i ? "L" : "M"}${L + i * bw},${y(t)} H${L + (i + 1) * bw}`).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-dasharray="6 4"/>`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="MRR par mois">${g}</svg>`;
  }
  function niceMax(v) {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v * 1.04) return m * p;
    return 10 * p;
  }

  function matrix(reps, months) {
    const ctx = contextMonths(months);
    const sel = new Set(months);
    const rows = reps.map(r => {
      const ps = S.partners.filter(p => p.repId === r.id);
      const vals = ctx.map(k => ps.reduce((s, p) => s + mrrOf(p, k), 0));
      const tot = vals.reduce((a, b) => a + b, 0);
      const t = r.active === false ? 0 : sumTargets(ctx.filter(k => k <= CUR));
      return `<tr><td style="white-space:nowrap">${esc(r.name)}</td>${vals.map((v, i) => `<td class="n ${v ? "" : "zero"} ${sel.has(ctx[i]) ? "cur" : ""}">${ctx[i] > CUR ? "" : v ? fmt(v) : "–"}</td>`).join("")}<td class="n"><b>${fmt(tot)}</b></td><td class="n">${chip(t ? tot / t : NaN)}</td></tr>`;
    }).join("");
    const colTot = ctx.map(k => S.partners.filter(p => reps.some(r => r.id === p.repId)).reduce((s, p) => s + mrrOf(p, k), 0));
    const all = colTot.reduce((a, b) => a + b, 0);
    return `<table class="t"><thead><tr><th>Commercial</th>${ctx.map(k => `<th class="n ${sel.has(k) ? "cur" : ""}">${ctx.length > 12 ? mLabel(k) : MONTHS[mOf(k) - 1]}</th>`).join("")}<th class="n">Total</th><th class="n">Atteinte</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Équipe</td>${colTot.map((v, i) => `<td class="n ${sel.has(ctx[i]) ? "cur" : ""}">${ctx[i] > CUR ? "" : fmt(v)}</td>`).join("")}<td class="n">${fmt(all)}</td><td></td></tr></tfoot></table>`;
  }

  function topPartners(months, repIds) {
    const list = S.partners.filter(p => repIds.has(p.repId)).map(p => ({ p, v: months.reduce((s, k) => s + mrrOf(p, k), 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 8);
    if (!list.length) return `<div class="empty">Aucun MRR saisi sur cette période.</div>`;
    return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Partenaire</th><th>Commercial</th><th class="n">MRR</th></tr></thead><tbody>
      ${list.map(x => `<tr><td>${esc(x.p.name)}</td><td class="muted">${esc(repName(x.p.repId))}</td><td class="n"><b>${fmt(x.v)}</b></td></tr>`).join("")}</tbody></table></div>`;
  }

  // ----- Entry -----
  function renderEntry() {
    const el = $("#view-entry");
    if (!S.loaded) { el.innerHTML = ""; return; }
    if (!S.reps.length) { el.innerHTML = emptyTeam(); return; }
    // keep what the person is typing across live refreshes
    const f = document.activeElement;
    const keep = f && f.closest && f.closest("#entryTable") && f.dataset.pid ? { cls: f.classList[0], pid: f.dataset.pid, k: f.dataset.k || "", val: f.value, s: f.selectionStart } : null;

    const y = ui.entryYear;
    const months = range(ym(y, 1), ym(y, 12));
    const y0 = Math.min(yOf(dataBounds().min), now.getFullYear() - 1);
    const years = []; for (let yy = now.getFullYear(); yy >= y0; yy--) years.push(yy);
    const q = ui.entryQ.trim().toLowerCase();
    const ps = S.partners
      .filter(p => ui.entryRep === "all" || p.repId === ui.entryRep)
      .filter(p => !p.recruited || yOf(p.recruited) <= y)
      .filter(p => !q || p.name.toLowerCase().includes(q) || (p.oip || "").toLowerCase().includes(q) || prods(p).join(" ").toLowerCase().includes(q))
      .sort((a, b) => (a.recruited || "").localeCompare(b.recruited || "") || a.name.localeCompare(b.name, "fr"));

    const colTot = months.map(k => ps.reduce((t, p) => t + mrrOf(p, k), 0));

    const nDup = ps.filter(p => dups.has(p.id)).length;
    const yearTot = colTot.reduce((a, b) => a + b, 0);
    const recruitedThisYear = ps.filter(p => p.recruited && yOf(p.recruited) === y).length;

    el.innerHTML = `<div style="display:grid;gap:20px">
      <div class="card">
        <h2>Nouveau partenaire</h2>
        <p class="sub">Enregistrez le partenaire dès sa signature. Il apparaît ensuite dans la grille ci-dessous, où vous saisissez son MRR chaque mois.</p>
        <form class="filters" id="newPartner">
          <label class="field" style="flex:2 1 220px"><span>Nom du partenaire</span><input type="text" id="np-name" required maxlength="120" placeholder="Ex. Telecom Services Lyon" ${ro ? "disabled" : ""}></label>
          <label class="field" style="flex:1 1 160px"><span>Commercial</span><select id="np-rep" required ${ro ? "disabled" : ""}>${activeReps().map(r => `<option value="${r.id}" ${ui.entryRep === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
          <label class="field" style="flex:1 1 150px"><span>Mois de recrutement</span><input type="month" id="np-month" value="${CUR}" max="${CUR}" required ${ro ? "disabled" : ""}></label>
          <label class="field" style="flex:1 1 130px"><span>OIP (facultatif)</span><input type="text" id="np-oip" maxlength="60" placeholder="N° OIP" ${ro ? "disabled" : ""}></label>
          <div class="field" style="flex:1 1 170px"><span>Type de produit DFP</span>${prodBtn("new", ui.npProducts, ro, true)}</div>
          <button class="btn primary" type="submit" ${ro ? "disabled" : ""}>Ajouter le partenaire</button>
        </form>
      </div>
      <div class="card">
        <div class="toolbar">
          <div><h2>MRR mensuel par partenaire · ${y}</h2>
          <p class="sub" style="margin:0">Une ligne par partenaire recruté, une colonne par mois : saisissez le nouveau MRR généré chaque mois. Les cases avant le mois de recrutement sont grisées. Entrée passe à la ligne suivante ; chaque montant est enregistré dès que vous quittez la case.</p></div>
        </div>
        <div class="filters" style="margin-bottom:14px">
          <label class="field"><span>Année</span><select id="entryYear">${years.map(yy => `<option value="${yy}" ${yy === y ? "selected" : ""}>${yy}</option>`).join("")}</select></label>
          <label class="field"><span>Commercial</span><select id="entryRep"><option value="all">Tous</option>${sortedReps().map(r => `<option value="${r.id}" ${ui.entryRep === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
          <label class="field"><span>Rechercher</span><input type="text" id="entryQ" value="${esc(ui.entryQ)}" placeholder="Nom, OIP ou produit"></label>
          <div class="field"><span>Total ${y}</span><b class="num" style="font-size:18px;line-height:36px">${fmt(yearTot)}</b></div>
          <div class="field"><span>Recrutés en ${y}</span><b class="num" style="font-size:18px;line-height:36px">${recruitedThisYear}</b></div>
        </div>
        ${nDup ? `<div class="banner" style="margin-bottom:12px"><span><b>${nDup} lignes</b> portent le même nom qu'un autre partenaire (marquées « Doublon ? »). Vérifiez-les et supprimez celles en trop.</span></div>` : ""}
        ${ps.length ? `<div class="tbl-wrap grid-wrap" id="entryTable"><table class="t grid">
          <thead><tr><th class="sticky">Partenaire</th><th>Recruté le</th><th>OIP</th><th>Type de produit DFP</th>${months.map(k => `<th class="n ${k === CUR ? "cur" : ""}">${MONTHS[mOf(k) - 1]}</th>`).join("")}<th class="n">Total ${y}</th></tr></thead>
          <tbody>${ps.map(p => {
            const tot = months.reduce((t, k) => t + mrrOf(p, k), 0);
            return `<tr><td class="sticky"><div class="name-cell"><div><b>${esc(p.name)}</b>${dupChip(dups, p)}<small>${esc(repName(p.repId))}</small></div>${ro ? "" : delBtn(p, true)}</div></td>
              <td><input class="rec-in" type="month" data-pid="${p.id}" value="${p.recruited || ""}" max="${CUR}" aria-label="Mois de recrutement ${esc(p.name)}" ${ro ? "disabled" : ""}></td>
              <td><input class="oip-in" type="text" data-pid="${p.id}" value="${esc(p.oip || "")}" maxlength="60" placeholder="À saisir" aria-label="OIP ${esc(p.name)}" ${ro ? "disabled" : ""}></td>
              <td>${prodBtn(p.id, prods(p), ro)}</td>
              ${months.map(k => {
                const before = p.recruited && k < p.recruited;
                const closed = (before && !mrrOf(p, k)) || k > CUR;
                if (closed) return `<td class="off ${k === CUR ? "cur" : ""}" aria-hidden="true"></td>`;
                const v = (p.mrr || {})[k];
                return `<td class="n ${k === CUR ? "cur" : ""}"><input class="mrr-in${before ? " pre" : ""}" step="0.01" ${before ? 'title="Montant saisi avant le mois de recrutement : vérifiez-le ou effacez-le"' : ""} type="number" min="0" inputmode="numeric" aria-label="MRR ${esc(p.name)} ${esc(mLong(k))}" data-pid="${p.id}" data-k="${k}" value="${v ?? ""}" ${ro ? "disabled" : ""}></td>`;
              }).join("")}
              <td class="n"><b>${fmt(tot)}</b></td></tr>`;
          }).join("")}</tbody>
          <tfoot><tr><td class="sticky">Total</td><td></td><td></td><td></td>${colTot.map((v, i) => `<td class="n ${months[i] === CUR ? "cur" : ""}">${months[i] > CUR ? "" : fmt(v)}</td>`).join("")}<td class="n">${fmt(yearTot)}</td></tr></tfoot>
        </table></div>`
          : `<div class="empty"><strong>Aucun partenaire à afficher</strong><span>${S.partners.length ? "Changez l'année, le commercial ou la recherche." : "Ajoutez votre premier partenaire avec le formulaire ci-dessus."}</span></div>`}
      </div>
    </div>`;
    if (keep) {
      const inp = $(`.${keep.cls}[data-pid="${keep.pid}"]${keep.k ? `[data-k="${keep.k}"]` : ""}`);
      if (inp) { inp.value = keep.val; inp.focus(); try { inp.setSelectionRange(keep.s, keep.s); } catch {} }
    } else if (ui.focusNext) {
      const inp = $(`.mrr-in[data-pid="${ui.focusNext.pid}"][data-k="${ui.focusNext.k}"]`);
      if (inp) { inp.focus(); inp.select(); }
    }
  }

      .filter(p => ui.partnerRep === "all" || p.repId === ui.partnerRep)

        <div class="filters">
          <label class="field"><span>Rechercher</span><input type="text" id="pq" value="${esc(ui.partnerQ)}" placeholder="Nom du partenaire"></label>
          <label class="field"><span>Commercial</span><select id="pRep"><option value="all">Tous</option>${sortedReps().map(r => `<option value="${r.id}" ${ui.partnerRep === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
        </div></div>

        ${ps.map(p => {
          const ks = Object.keys(p.mrr || {}).filter(k => mrrOf(p, k) > 0).sort();

            <td class="n"><div class="row-actions">${ro ? "" : `<button class="btn ghost" data-edit="${p.id}">Modifier</button>${delBtn(p)}`}</div></td></tr>`;
        }).join("")}</tbody></table></div>`
        : `<div class="empty"><strong>Aucun partenaire trouvé</strong><span>${S.partners.length ? "Modifiez la recherche ou le filtre." : "Ajoutez votre premier partenaire depuis l'onglet « Saisie MRR »."}</span>${!S.partners.length && !ro ? `<button class="btn primary" data-goto="entry">Ajouter un partenaire</button>` : ""}</div>`}
    </div>`;
  }

  // ----- Bonus tracking -----
  function renderBonus() {
    const el = $("#view-bonus");
    if (!S.loaded) { el.innerHTML = ""; return; }
    if (!S.reps.length) { el.innerHTML = emptyTeam(); return; }
    const y = ui.bonusYear, q = ui.bonusGran === "quarter";
    const y0 = Math.min(yOf(dataBounds().min), now.getFullYear() - 1);
    const years = []; for (let yy = now.getFullYear(); yy >= y0; yy--) years.push(yy);
    const all = range(ym(y, 1), ym(y, 12));
    // columns: months, or quarters (3 months each)
    const cols = q ? [1, 2, 3, 4].map(n => ({ label: `T${n}`, months: all.slice(n * 3 - 3, n * 3) })) : all.map(k => ({ label: MONTHS[mOf(k) - 1], months: [k] }));
    const reps = sortedReps().filter(r => r.active !== false || S.partners.some(p => p.repId === r.id && all.some(k => mrrOf(p, k) > 0)));
    const curCol = cols.findIndex(c => c.months.includes(CUR));
    const cell = (r, c) => {
      const el = c.months.filter(k => k <= CUR);
      if (!el.length) return `<td class="n zero">—</td>`;
      const mrr = S.partners.filter(p => p.repId === r.id).reduce((t, p) => t + c.months.reduce((u, k) => u + mrrOf(p, k), 0), 0);
      const tgt = r.active === false ? 0 : sumTargets(c.months);
      const open = c.months.some(k => k >= CUR);
      const ratio = tgt ? mrr / tgt : NaN;
      return `<td class="n b-cell ${open ? "cur" : ""}" data-tip="<b>${esc(r.name)} · ${esc(c.label)} ${y}</b><br>MRR : ${fmt(mrr)}<br>Objectif : ${fmt(tgt)}${open ? "<br><i>Période en cours</i>" : ""}"><b>${fmt(mrr)}</b>${tgt ? chip(ratio) : mrr ? `<span class="muted" style="font-size:11px">sans objectif</span>` : ""}</td>`;
    };
    const yearEl = all.filter(k => k <= CUR);
    el.innerHTML = `<div class="card">
      <div class="toolbar">
        <div><h2>Suivi des primes · ${y}</h2>
        <p class="sub" style="margin:0">MRR généré par les nouveaux partenaires de chaque commercial, comparé à son objectif ${q ? "trimestriel" : "mensuel"}. ${lastUpdate() ? "Données à jour au " + new Date(lastUpdate()).toLocaleString("fr-FR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) + "." : ""}</p></div>
        <div class="filters">
          <div class="field"><span>Vue</span><div class="seg" role="group" aria-label="Vue">${[["month", "Mois"], ["quarter", "Trimestres"]].map(([g, l]) => `<button data-bgran="${g}" aria-pressed="${ui.bonusGran === g}">${l}</button>`).join("")}</div></div>
          <label class="field"><span>Année</span><select id="bonusYear">${years.map(yy => `<option value="${yy}" ${yy === y ? "selected" : ""}>${yy}</option>`).join("")}</select></label>
        </div>
      </div>
      <div class="tbl-wrap"><table class="t b-table">
        <thead><tr><th>Commercial</th>${cols.map((c, i) => `<th class="n ${i === curCol ? "cur" : ""}">${c.label}<small>obj. ${fmt(sumTargets(c.months))}</small></th>`).join("")}<th class="n">Cumul ${y}<small>obj. à date ${fmt(sumTargets(yearEl))}</small></th></tr></thead>
        <tbody>${reps.map(r => {
          const mrr = S.partners.filter(p => p.repId === r.id).reduce((t, p) => t + yearEl.reduce((u, k) => u + mrrOf(p, k), 0), 0);
          const tgt = r.active === false ? 0 : sumTargets(yearEl);
          return `<tr><td style="white-space:nowrap"><b>${esc(r.name)}</b>${r.active === false ? ' <span class="muted">(inactif)</span>' : ""}</td>${cols.map(c => cell(r, c)).join("")}<td class="n b-cell"><b>${fmt(mrr)}</b>${tgt ? chip(mrr / tgt) : ""}</td></tr>`;
        }).join("")}</tbody>
      </table></div>
      <div class="legend"><span><span class="chip good">✓ ≥ 100 %</span> objectif atteint</span><span><span class="chip warn">● 70 à 99 %</span> proche</span><span><span class="chip bad">▼ &lt; 70 %</span> en retard</span><span>Colonne surlignée : période en cours, chiffres encore provisoires.</span></div>
    </div>`;
  }

  // ----- Visits (admins only) -----
  function renderVisits() {
    const el = $("#view-visits");
    if (!S.isAdmin) { el.innerHTML = ""; return; }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const lastDays = n => { const out = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); out.push(dayKey(d)); } return out; };
    const d14 = lastDays(14), d7 = new Set(lastDays(7)), d30 = new Set(lastDays(30));
    const vs = (S.visits || []).map(v => {
      const days = v.days || {};
      const sum = set => Object.entries(days).reduce((t, [k, n]) => t + (set.has(k) ? +n || 0 : 0), 0);
      const ago = v.lastAt ? Math.floor((today - new Date(new Date(v.lastAt).setHours(0, 0, 0, 0))) / 864e5) : 999;
      return { ...v, days, w7: sum(d7), w30: sum(d30), ago };
    }).sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));
    const todayN = vs.filter(v => v.ago === 0).length, weekN = vs.filter(v => v.w7 > 0).length;
    const status = ago => ago <= 2 ? `<span class="chip good">✓ Actif</span>` : ago <= 7 ? `<span class="chip warn">● À relancer</span>` : `<span class="chip bad">▼ Inactif</span>`;
    const when = t => t ? new Date(t).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
    const agoTxt = a => a === 0 ? "aujourd'hui" : a === 1 ? "hier" : `il y a ${a} jours`;
    el.innerHTML = `<div style="display:grid;gap:20px">
      <div class="kpis">
        <div class="kpi"><span class="label">Consultations aujourd'hui</span><span class="v">${todayN}</span><span class="d">personne${todayN > 1 ? "s" : ""} différente${todayN > 1 ? "s" : ""}</span></div>
        <div class="kpi"><span class="label">7 derniers jours</span><span class="v">${weekN}</span><span class="d">personne${weekN > 1 ? "s" : ""} ont consulté la page</span></div>
        <div class="kpi"><span class="label">Personnes suivies</span><span class="v">${vs.length}</span><span class="d">depuis la mise en place du suivi</span></div>
      </div>
      <div class="card">
        <h2>Connexions de l'équipe</h2>
        <p class="sub">Une visite est comptée à chaque ouverture de la page. Visible uniquement par vous et les Éditeurs. Vos propres visites ne sont pas comptées.</p>
        ${S.mode === "local" ? `<div class="empty"><strong>Suivi disponible sur la version en ligne</strong><span>Les connexions s'enregistrent quand l'équipe ouvre la page depuis son lien claude.ai.</span></div>`
        : !vs.length ? `<div class="empty"><strong>Aucune consultation enregistrée pour l'instant</strong><span>Chaque commercial apparaîtra ici dès sa première ouverture de la page. Partagez-la en accès « Contributeur » : un accès « Lecteur » ne permet pas d'enregistrer la visite.</span></div>`
        : `<div class="tbl-wrap"><table class="t">
          <thead><tr><th>Personne</th><th>Statut</th><th>Dernière visite</th><th class="n">7 jours</th><th class="n">30 jours</th><th class="n">Total</th><th>14 derniers jours</th><th>Première visite</th></tr></thead>
          <tbody>${vs.map(v => `<tr>
            <td style="white-space:nowrap"><b>${esc(S.names[v.id] || "Utilisateur")}</b></td>
            <td>${status(v.ago)}</td>
            <td style="white-space:nowrap">${when(v.lastAt)}<small class="muted" style="display:block">${agoTxt(v.ago)}</small></td>
            <td class="n">${v.w7}</td><td class="n">${v.w30}</td><td class="n">${+v.count || 0}</td>
            <td><div class="strip">${d14.map(k => { const n = +v.days[k] || 0; const d = new Date(k + "T12:00:00"); return `<i class="${n ? "on" : ""}" data-tip="${d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })} : ${n ? n + " visite" + (n > 1 ? "s" : "") : "aucune visite"}"></i>`; }).join("")}</div></td>
            <td class="muted" style="white-space:nowrap">${v.firstAt ? new Date(v.firstAt).toLocaleDateString("fr-FR") : "—"}</td>
          </tr>`).join("")}</tbody></table></div>
          <div class="legend"><span><span class="chip good">✓ Actif</span> visite ces 2 derniers jours</span><span><span class="chip warn">● À relancer</span> 3 à 7 jours</span><span><span class="chip bad">▼ Inactif</span> plus de 7 jours</span></div>`}
      </div></div>`;
  }

  // ----- Team -----
  function renderTeam() {
    const el = $("#view-team");
    if (!S.loaded) { el.innerHTML = ""; return; }
    const ro = !S.canWrite;
    const reps = sortedReps();
    el.innerHTML = `<div class="grid2">
