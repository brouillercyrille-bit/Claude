              <td><button class="btn ghost" data-toggle="${r.id}" ${ro ? "disabled" : ""}>${r.active === false ? "Inactif · réactiver" : "Actif · désactiver"}</button></td>
              <td class="n">${n}</td>
              <td class="n">${ro ? "" : n ? "" : `<button class="btn ghost danger" data-delrep="${r.id}">Supprimer</button>`}</td></tr>`;
          }).join("")}</tbody></table></div>` : `<div class="empty"><strong>Aucun commercial pour l'instant</strong><span>Ajoutez-les un par un, ou créez 9 fiches à renommer.</span>${ro ? "" : `<button class="btn" data-act="seed9">Créer 9 commerciaux à renommer</button>`}</div>`}
        ${ro ? "" : `<form class="filters" id="newRep" style="margin-top:14px"><label class="field" style="flex:1"><span>Nouveau commercial</span><input type="text" id="nr-name" maxlength="60" required placeholder="Prénom Nom"></label><button class="btn primary" type="submit">Ajouter</button></form>`}
      </div>
      <div class="card">
        <h2>Objectifs mensuels</h2>
        <p class="sub">MRR que chaque commercial doit générer avec ses nouveaux partenaires, mois par mois. L'objectif d'une période = somme des objectifs des mois × commerciaux actifs.</p>
        ${(() => {
          const ty = ui.teamYear, ms = range(ym(ty, 1), ym(ty, 12));
          const nAct = reps.filter(r => r.active !== false).length;
          const qs = [1, 2, 3, 4].map(q => sumTargets(ms.slice(q * 3 - 3, q * 3)));
          return `<form id="targetForm" style="display:grid;gap:14px">
          <div class="filters">
            <label class="field"><span>Année</span><select id="teamYear">${[now.getFullYear() + 1, now.getFullYear(), now.getFullYear() - 1].map(yy => `<option value="${yy}" ${yy === ty ? "selected" : ""}>${yy}</option>`).join("")}</select></label>
            <label class="field"><span>Objectif par défaut (€ / mois)</span><input type="number" id="tgt" min="0" step="0.01" value="${target()}" ${ro ? "disabled" : ""}></label>
          </div>
          <div class="tgt-grid">${ms.map(k => `<label class="field"><span>${MONTHS_L[mOf(k) - 1]}</span><input type="number" class="tgt-m" data-k="${k}" min="0" step="0.01" value="${targetFor(k)}" ${ro ? "disabled" : ""}></label>`).join("")}</div>
          ${ro ? "" : `<div><button class="btn primary" type="submit">Enregistrer les objectifs</button></div>`}
          </form>
          <div class="kpis" style="margin-top:18px">
            ${qs.map((v, i) => `<div class="kpi" style="box-shadow:none;background:var(--surface-2)"><span class="label">T${i + 1} ${ty} / commercial</span><span class="v" style="font-size:22px">${fmt(v)}</span><span class="d">Équipe : ${fmt(v * nAct)}</span></div>`).join("")}
          </div>
          <p class="sub" style="margin:12px 0 0">Année ${ty} : ${fmt(sumTargets(ms))} par commercial, ${fmt(sumTargets(ms) * nAct)} pour l'équipe (${nAct} actif${nAct > 1 ? "s" : ""}).</p>`;
        })()}
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <h2>Types de produit DFP</h2>
      <p class="sub">La liste proposée dans le menu déroulant « Type de produit DFP ». Un produit par ligne. Retirer un produit ici ne l'efface pas des partenaires qui l'ont déjà.</p>
      <form id="prodForm" style="display:grid;gap:12px;max-width:420px">
        <textarea id="prodCat" aria-label="Liste des produits" ${ro ? "disabled" : ""}>${esc(catalog().join("\n"))}</textarea>
        ${ro ? "" : `<div><button class="btn primary" type="submit">Enregistrer la liste</button></div>`}
      </form>
    </div>`;
  }

  // ---------- modal ----------
  let editProducts = [];
  function openEdit(id) {
    const p = S.partners.find(x => x.id === id);
    if (!p) return;
    editProducts = [...prods(p)];
    $("#modalRoot").innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h3 id="mt">Modifier le partenaire</h3>
      <form class="stack" id="editForm">
        <label class="field"><span>Nom</span><input type="text" id="ed-name" value="${esc(p.name)}" maxlength="120" required></label>
        <label class="field"><span>Commercial</span><select id="ed-rep">${sortedReps().map(r => `<option value="${r.id}" ${r.id === p.repId ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
        <label class="field"><span>Mois de recrutement</span><input type="month" id="ed-month" value="${p.recruited || ""}" max="${CUR}" required></label>
        <label class="field"><span>OIP</span><input type="text" id="ed-oip" value="${esc(p.oip || "")}" maxlength="60"></label>
        <div class="field"><span>Type de produit DFP</span><div id="edProdWrap">${prodBtn("edit", editProducts, false, true)}</div></div>
        <div class="acts"><button type="button" class="btn danger" id="ed-del">Supprimer</button>
          <span style="display:flex;gap:8px"><button type="button" class="btn" id="ed-cancel">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></span></div>
      </form></div></div>`;
    $("#ed-name").focus();
    const close = () => { $("#modalRoot").innerHTML = ""; };
    $("#ov").addEventListener("click", e => { if (e.target.id === "ov") close(); });
    $("#ed-cancel").onclick = close;
    $("#ov").addEventListener("keydown", e => { if (e.key === "Escape") close(); });
    $("#ed-del").onclick = async e => {
      const b = e.currentTarget;
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
      close(); await guarded(() => api.deletePartner(id), "Partenaire supprimé");
    };
    $("#editForm").onsubmit = async e => {
      e.preventDefault();
      const np = { ...p, mrr: { ...(p.mrr || {}) }, name: $("#ed-name").value.trim(), repId: $("#ed-rep").value, recruited: $("#ed-month").value, oip: $("#ed-oip").value.trim(), products: [...editProducts], product: undefined, updatedAt: Date.now() };
      if (!np.name) return;
      close(); await guarded(() => api.savePartner(np), "Partenaire mis à jour");
    };
  }

  // ---------- product picker (multi-select dropdown) ----------
  let pick = null;
  function selectedFor(id) {
    if (id === "new") return ui.npProducts;
    if (id === "edit") return editProducts;
    const p = S.partners.find(x => x.id === id);
    return p ? prods(p) : [];
  }
  function openPicker(btn) {
    const id = btn.dataset.pick, cur = selectedFor(id);
    pick = { id, orig: [...cur], btn };
    const items = [...new Set([...catalog(), ...cur])];
    $("#pickRoot").innerHTML = `<div class="pick-back" data-pick-close></div>
      <div class="pick" role="dialog" aria-label="Type de produit DFP">
        <input type="text" class="pick-q" placeholder="Rechercher" aria-label="Rechercher un produit">
        <div class="pick-list">${items.map(v => `<label class="pick-item"><input type="checkbox" value="${esc(v)}" ${cur.includes(v) ? "checked" : ""}><span>${esc(v)}</span></label>`).join("")}</div>
        <div class="pick-foot"><span id="pickCount">${cur.length} sélectionné${cur.length > 1 ? "s" : ""}</span><button type="button" class="btn primary" data-pick-close>Valider</button></div>
      </div>`;
    const el = $(".pick"), r = btn.getBoundingClientRect();
    const h = el.offsetHeight;
    el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + "px";
    el.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4) + "px";
    $(".pick-q").focus();
  }
  async function closePicker() {
    if (!pick) return;
    const { id, orig, btn } = pick;
    const checked = new Set($$(".pick-list input:checked").map(i => i.value));
    const order = [...new Set([...catalog(), ...orig])];
    const next = order.filter(v => checked.has(v));
    pick = null;
    $("#pickRoot").innerHTML = "";
    if (next.join("|") === orig.join("|")) { btn.focus(); return; }
    if (id === "new" || id === "edit") {
      if (id === "new") ui.npProducts = next; else editProducts = next;
      const tpl = document.createElement("template"); tpl.innerHTML = prodBtn(id, next, false, true);
      btn.replaceWith(tpl.content.firstChild);
      return;
    }
    const p = S.partners.find(x => x.id === id);
    if (p) await guarded(() => api.savePartner({ ...p, products: next, product: undefined, updatedAt: Date.now() }), `${p.name} : ${next.length ? next.length + " produit" + (next.length > 1 ? "s" : "") : "aucun produit"}`);
  }
  document.addEventListener("input", e => {
    if (e.target.classList && e.target.classList.contains("pick-q")) {
      const q = e.target.value.trim().toLowerCase();
      $$(".pick-item").forEach(l => { l.hidden = q && !l.textContent.toLowerCase().includes(q); });
    }
  });
  document.addEventListener("change", e => {
    if (e.target.closest && e.target.closest(".pick-list")) {
      const n = $$(".pick-list input:checked").length;
      $("#pickCount").textContent = `${n} sélectionné${n > 1 ? "s" : ""}`;
    }
  });
  document.addEventListener("keydown", e => {
    if (pick && e.key === "Escape") { e.stopPropagation(); closePicker(); }
    if (pick && e.key === "Enter" && e.target.classList && e.target.classList.contains("pick-q")) {
      e.preventDefault();
      const first = $$(".pick-item").find(l => !l.hidden);
      if (first) { const c = first.querySelector("input"); c.checked = !c.checked; c.dispatchEvent(new Event("change", { bubbles: true })); }
    }
  }, true);

  let toastT;
  function toast(msg) {
    let t = $("#toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- CSV ----------
  function csv() {
    const rows = [["Partenaire", "OIP", "Type de produit DFP", "Commercial", "Mois de recrutement", "Mois", "MRR (EUR)"]];
    for (const p of S.partners) for (const k of Object.keys(p.mrr || {}).sort()) if (mrrOf(p, k)) rows.push([p.name, p.oip || "", prods(p).join(", "), repName(p.repId), p.recruited || "", k, mrrOf(p, k).toFixed(2).replace(".", ",")]);
    return "﻿" + rows.map(r => r.map(c => /[";\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(";")).join("\n");
  }
  async function exportCsv() {
    const data = csv();
    if (downloads) {
      try { const r = await downloads.save({ filename: `mrr-partenaires-${CUR}.csv`, data }); if (r && r.status === "saved") toast("Export enregistré"); return; }
      catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return; }
    }
    try { await navigator.clipboard.writeText(data); toast("CSV copié dans le presse-papiers"); }
    catch { toast("Export indisponible dans cette vue."); }
  }

  // ---------- demo (local mode only) ----------
  function loadDemo() {
    const names = ["Commercial A", "Commercial B", "Commercial C", "Commercial D", "Commercial E", "Commercial F", "Commercial G", "Commercial H", "Commercial I"];
    S.reps = names.map((n, i) => ({ id: "demo-r" + i, name: n + " (exemple)", order: i, active: true }));
    S.partners = [];
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const start = addM(CUR, -11);
    S.reps.forEach((r, i) => {
      const n = 2 + Math.floor(rnd() * 4);
      for (let j = 0; j < n; j++) {
        const rec = addM(start, Math.floor(rnd() * 11));
        const mrr = {}; let base = 80 + Math.round(rnd() * 250);
        for (const k of range(rec, CUR)) { mrr[k] = Math.round(base); base *= 1 + rnd() * 0.08; }
        S.partners.push({ id: `demo-p${i}-${j}`, name: `Partenaire exemple ${i + 1}.${j + 1}`, repId: r.id, recruited: rec, mrr, createdAt: Date.now() });
      }
    });
    local.persist(); render(); toast("Exemple chargé : remplacez-le par vos vraies données");
  }

  // ---------- events ----------
  document.addEventListener("click", async e => {
    if (e.target.closest("[data-pick-close]")) { closePicker(); return; }
    const t = e.target.closest("button, [data-goto]");
    if (!t) return;
    if (t.dataset.pick) { openPicker(t); return; }
    if (t.dataset.tab) { ui.tab = t.dataset.tab; savePrefs(); render(); return; }
    if (t.dataset.goto) { ui.tab = t.dataset.goto; savePrefs(); render(); return; }
    if (t.dataset.bgran) { ui.bonusGran = t.dataset.bgran; render(); return; }
    if (t.dataset.gran) { ui.gran = t.dataset.gran; ui.period = defaultPeriod(ui.gran); savePrefs(); render(); return; }
    if (t.dataset.edit) { openEdit(t.dataset.edit); return; }
    if (t.dataset.delp) {
      const p = S.partners.find(x => x.id === t.dataset.delp);
      if (!p) return;
      if (!t.classList.contains("armed")) {
        $$(".del-btn.armed").forEach(b => { b.classList.remove("armed"); b.textContent = b.dataset.label; });
        t.classList.add("armed"); t.textContent = "Confirmer ?";
        setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = t.dataset.label; } }, 5000);
        return;
      }
      await guarded(() => api.deletePartner(p.id), `${p.name} supprimé`);
      return;
    }
    if (t.dataset.toggle) { const r = S.reps.find(x => x.id === t.dataset.toggle); if (r) await guarded(() => api.saveRep({ ...r, active: r.active === false })); return; }
    if (t.dataset.delrep) {
      if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirmer"; return; }
      await guarded(() => api.deleteRep(t.dataset.delrep), "Commercial supprimé"); return;
    }
    const act = t.dataset.act;
    if (act === "export") exportCsv();
    if (act === "demo") loadDemo();
    if (act === "seed9") {
      for (let i = 0; i < 9; i++) { const ok = await guarded(() => api.saveRep({ id: uid("r"), name: `Commercial ${i + 1}`, order: i, active: true })); if (!ok) break; }
      toast("9 commerciaux créés : renommez-les ci-dessous");
    }
  });

  document.addEventListener("change", async e => {
    const t = e.target;
    if (t.id === "periodSel") { ui.period = t.value; render(); }
    if (t.id === "dashRep") { ui.dashRep = t.value; render(); }
    if (t.id === "entryYear") { ui.entryYear = +t.value; render(); }
    if (t.id === "entryRep") { ui.entryRep = t.value; savePrefs(); render(); }
    if (t.id === "pRep") { ui.partnerRep = t.value; render(); }
    if (t.id === "bonusYear") { ui.bonusYear = +t.value; render(); }
    if (t.id === "teamYear") { ui.teamYear = +t.value; render(); }
    if (t.classList.contains("mrr-in")) {
      const p = S.partners.find(x => x.id === t.dataset.pid);
      if (!p) return;
      const raw = t.value.trim();
      const v = raw === "" ? null : parseAmount(raw);
      if (raw !== "" && !isFinite(v)) return;
      const mk = t.dataset.k;
      const cur = (p.mrr || {})[mk];
      if ((cur ?? null) === v) return;
      const mrr = { ...(p.mrr || {}) };
      if (v === null) delete mrr[mk]; else mrr[mk] = v;
      await guarded(() => api.savePartner({ ...p, mrr, updatedAt: Date.now() }), `${p.name} · ${mLong(mk)} : ${v === null ? "montant effacé" : fmt(v) + " enregistré"}`);
    }
    if (t.classList.contains("rec-in") || t.classList.contains("oip-in")) {
      const p = S.partners.find(x => x.id === t.dataset.pid);
      if (!p) return;
      if (t.classList.contains("rec-in")) {
        const v = t.value;
        if (!v || v > CUR) { t.value = p.recruited || ""; toast("Choisissez un mois de recrutement passé ou en cours."); return; }
        if (v === p.recruited) return;
        const early = Object.keys(p.mrr || {}).filter(k => k < v && mrrOf(p, k) > 0);
        const ok = await guarded(() => api.savePartner({ ...p, recruited: v, updatedAt: Date.now() }), `${p.name} : recruté en ${mLong(v)}`);
        if (ok && early.length) toast(`Attention : du MRR est saisi avant ${mLong(v)} (cases orange). Vérifiez-le ou effacez-le.`);
        if (ok && yOf(v) > ui.entryYear) { ui.entryYear = yOf(v); render(); }
      } else {
        const v = t.value.trim();
        if (v === (p.oip || "")) return;
        await guarded(() => api.savePartner({ ...p, oip: v, updatedAt: Date.now() }), `${p.name} : OIP ${v ? "enregistré" : "effacé"}`);
      }
    }
    if (t.classList.contains("rep-name-in")) {
      const r = S.reps.find(x => x.id === t.dataset.rid);
      const name = t.value.trim();
      if (r && name && name !== r.name) await guarded(() => api.saveRep({ ...r, name }), "Nom enregistré");
      else if (r) t.value = r.name;
    }
  });

  document.addEventListener("keydown", e => {
    const t = e.target;
    if (e.key !== "Enter" || !t.classList || !t.classList.contains("mrr-in")) return;
    e.preventDefault();
    const col = $$(`.mrr-in[data-k="${t.dataset.k}"]`);
    const next = col[col.indexOf(t) + (e.shiftKey ? -1 : 1)];
    if (next) {
      ui.focusNext = { pid: next.dataset.pid, k: next.dataset.k };
      next.focus(); next.select();
      setTimeout(() => { ui.focusNext = null; }, 0);
    } else t.blur();
  });

  document.addEventListener("input", e => {
    if (e.target.id === "entryQ") {
      ui.entryQ = e.target.value;
      const pos = e.target.selectionStart;
      renderEntry();
      const n = $("#entryQ"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
    }
    if (e.target.id === "pq") {
      ui.partnerQ = e.target.value;
      const pos = e.target.selectionStart;
      renderPartners();
      const n = $("#pq"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
    }
  });

  document.addEventListener("submit", async e => {
    const f = e.target;
    e.preventDefault();
    if (f.id === "newPartner") {
      const name = $("#np-name").value.trim(), repId = $("#np-rep").value, rec = $("#np-month").value, oip = $("#np-oip").value.trim(), products = [...ui.npProducts];
      if (!name || !repId || !rec) return;
      const mrr = {};
      const ok = await guarded(() => api.savePartner({ id: uid("p"), name, repId, recruited: rec, oip, products, mrr, createdAt: Date.now(), updatedAt: Date.now() }), `${name} ajouté`);
      if (ok) { ui.entryYear = yOf(rec); ui.npProducts = []; render(); const o = $("#np-oip"); if (o) o.value = "";  const n = $("#np-name"); if (n) { n.value = ""; n.focus(); } }
    }
    if (f.id === "newRep") {
      const name = $("#nr-name").value.trim();
      if (!name) return;
      const order = Math.max(-1, ...S.reps.map(r => r.order ?? 0)) + 1;
      if (await guarded(() => api.saveRep({ id: uid("r"), name, order, active: true }), `${name} ajouté`)) { const n = $("#nr-name"); if (n) { n.value = ""; n.focus(); } }
    }
    if (f.id === "prodForm") {
      const list = [...new Set($("#prodCat").value.split("\n").map(v => v.trim()).filter(Boolean))];
      if (!list.length) { toast("La liste doit contenir au moins un produit."); return; }
      await guarded(() => api.saveSettings({ ...S.settings, products: list }), "Liste des produits enregistrée");
    }
    if (f.id === "targetForm") {
      const base = parseAmount($("#tgt").value || 0) || 0;
      const targets = { ...(S.settings.targets || {}) };
      for (const inp of $$(".tgt-m")) {
        const v = inp.value.trim() === "" ? base : (parseAmount(inp.value) || 0);
        if (v === base) delete targets[inp.dataset.k]; else targets[inp.dataset.k] = v;
      }
      await guarded(() => api.saveSettings({ ...S.settings, monthlyTarget: base, targets }), "Objectifs enregistrés");
    }
  });

  // tooltips
  const tip = $("#tip");
  document.addEventListener("pointermove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.getAttribute("data-tip");
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  });
  document.addEventListener("pointerleave", () => { tip.hidden = true; });

  render();
  boot();
})();
</script>
